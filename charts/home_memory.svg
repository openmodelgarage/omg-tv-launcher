<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'Space Grotesk', 'Segoe UI', sans-serif">
<rect width="1600" height="900" fill="#141416"/>
<text x="300" y="80" fill="#F5F5F7" font-size="44" font-weight="500">Home screen memory (PSS)</text>
<text x="300" y="122" fill="#8E8E93" font-size="24">Median of 5 runs · bar end = median · thin line = min–max · lower is better</text>
<line x1="300" y1="150" x2="300" y2="830" stroke="#2A2A2C" stroke-width="1"/>
<text x="300" y="860" fill="#8E8E93" font-size="20" text-anchor="middle">0 MB</text>
<line x1="647" y1="150" x2="647" y2="830" stroke="#2A2A2C" stroke-width="1"/>
<text x="647" y="860" fill="#8E8E93" font-size="20" text-anchor="middle">50 MB</text>
<line x1="993" y1="150" x2="993" y2="830" stroke="#2A2A2C" stroke-width="1"/>
<text x="993" y="860" fill="#8E8E93" font-size="20" text-anchor="middle">100 MB</text>
<line x1="1340" y1="150" x2="1340" y2="830" stroke="#2A2A2C" stroke-width="1"/>
<text x="1340" y="860" fill="#8E8E93" font-size="20" text-anchor="middle">150 MB</text>
<g><title>before: 99 MB (median), range 93 MB–100 MB</title><path d="M300,307.0 h680.3 a4,4 0 0 1 4,4 v102.0 a4,4 0 0 1 -4,4 h-680.3 z" fill="#8E8E93"/><line x1="944.8" x2="994.7" y1="362.0" y2="362.0" stroke="#F5F5F7" stroke-opacity="0.55" stroke-width="2"/><text x="1008.7" y="371.0" fill="#F5F5F7" font-size="26">99 MB</text></g>
<text x="276" y="371.0" fill="#8E8E93" font-size="26" text-anchor="end">before</text>
<g><title>debloat: 102 MB (median), range 102 MB–107 MB</title><path d="M300,419.0 h706.7 a4,4 0 0 1 4,4 v102.0 a4,4 0 0 1 -4,4 h-706.7 z" fill="#5C5C61"/><line x1="1010.0" x2="1040.5" y1="474.0" y2="474.0" stroke="#F5F5F7" stroke-opacity="0.55" stroke-width="2"/><text x="1054.5" y="483.0" fill="#F5F5F7" font-size="26">102 MB</text></g>
<text x="276" y="483.0" fill="#8E8E93" font-size="26" text-anchor="end">debloat</text>
<g><title>after: 18 MB (median), range 16 MB–18 MB</title><path d="M300,531.0 h118.7 a4,4 0 0 1 4,4 v102.0 a4,4 0 0 1 -4,4 h-118.7 z" fill="#FF453A"/><line x1="413.0" x2="422.7" y1="586.0" y2="586.0" stroke="#F5F5F7" stroke-opacity="0.55" stroke-width="2"/><text x="436.7" y="595.0" fill="#F5F5F7" font-size="26">18 MB</text></g>
<text x="276" y="595.0" fill="#8E8E93" font-size="26" text-anchor="end">after</text>
<rect x="300" y="874" width="18" height="18" rx="4" fill="#8E8E93"/><text x="328" y="889" fill="#8E8E93" font-size="20">before</text>
<rect x="432" y="874" width="18" height="18" rx="4" fill="#5C5C61"/><text x="460" y="889" fill="#8E8E93" font-size="20">debloat</text>
