<text x="1340" y="860" fill="#8E8E93" font-size="20" text-anchor="middle">1,000 MB</text>
<g><title>before: 573 MB (median), range 568 MB–578 MB</title><path d="M300,307.0 h591.9 a4,4 0 0 1 4,4 v102.0 a4,4 0 0 1 -4,4 h-591.9 z" fill="#8E8E93"/><line x1="890.7" x2="901.1" y1="362.0" y2="362.0" stroke="#F5F5F7" stroke-opacity="0.55" stroke-width="2"/><text x="915.1" y="371.0" fill="#F5F5F7" font-size="26">573 MB</text></g>
<text x="276" y="371.0" fill="#8E8E93" font-size="26" text-anchor="end">before</text>
